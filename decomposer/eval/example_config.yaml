# amfv-eval pipeline configuration
# Run with: DIR=/mount/marii python slurm/pipeline.py --config example_config.yaml
#
# All relative paths are resolved against the DIR environment variable.
# Set DIR to your per-user data directory on the cluster, e.g. DIR=/mount/marii

# Shared settings
base_url: http://localhost:8000/v1
cache_dir: cache/amfv_eval
partition: n       # GPU nodes
cpu_partition: c   # CPU-only nodes (shard/merge jobs)
account: training
tensor_parallel: 2
n_shards: 8
max_gpus: 8  # caps concurrent array tasks: max_gpus / tensor_parallel = 4 shards at once
qos: normal  # default; override per-step below
time_limit: "24:00:00"  # per-job wall time; override per-step if needed
# vllm container image is set via VLLM_IMAGE env var (defaults to docker://vllm/vllm-openai:latest)

generate:
  model: Qwen/Qwen3.6-35B-A3B
  qos: normal
  splits: [train, validation]
  n_examples: 10
  seed: 42
  out: generated.jsonl

# Below can have multiple entries, one per model. Each entry can override the shared settings above.
filter:
  - model: Qwen/Qwen3.6-35B-A3B
    qos: normal
    input: generated.jsonl
    out: filtered_1.jsonl
    failures: filtered_1_fail.jsonl

decompose:
  - model: Qwen/Qwen3.6-35B-A3B
    qos: low
    enable_thinking: true
    out: decomposed_35.jsonl
  - model: Qwen/Qwen3-1.7B
    qos: low
    enable_thinking: true
    out: decomposed_qwen3_17b.jsonl
  - model: LiquidAI/LFM2.5-8B-A1B
    qos: low
    enable_thinking: false
    out: decomposed_lfm_8b.jsonl
  - model: Qwen/Qwen3-8B
    qos: low
    enable_thinking: true
    out: decomposed_qwen3_8b.jsonl
  - model: Qwen/Qwen3.6-27B
    qos: low
    enable_thinking: true
    out: decomposed_qwen36_27b.jsonl
  - model: baichuan-inc/Baichuan-M2-32B
    qos: low
    enable_thinking: false
    out: decomposed_baichuan_32b.jsonl
  - model: google/gemma-4-E4B
    qos: low
    enable_thinking: false
    out: decomposed_gemma4_e4b.jsonl

eval:
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_35.jsonl
    out: results_35.jsonl  # summary in results_35.metrics.json
    failures: results_35_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_qwen3_17b.jsonl
    out: results_qwen3_17b.jsonl
    failures: results_qwen3_17b_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_lfm_8b.jsonl
    out: results_lfm_8b.jsonl
    failures: results_lfm_8b_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_qwen3_8b.jsonl
    out: results_qwen3_8b.jsonl
    failures: results_qwen3_8b_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_qwen36_27b.jsonl
    out: results_qwen36_27b.jsonl
    failures: results_qwen36_27b_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_baichuan_32b.jsonl
    out: results_baichuan_32b.jsonl
    failures: results_baichuan_32b_fail.jsonl
  - model: Qwen/Qwen3.6-35B-A3B
    qos: bottom
    input: decomposed_gemma4_e4b.jsonl
    out: results_gemma4_e4b.jsonl
    failures: results_gemma4_e4b_fail.jsonl
