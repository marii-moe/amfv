[project]
name = "amfv-eval"
version = "0.0.1"
description = "Decomposer eval-set generation for AMFV"
requires-python = ">=3.13"
dependencies = [
    "amfv-utils",
    "jinja2>=3.0",
    "openai>=1.50",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
    "datasets>=2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
extend = "../../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["test"]

[project.scripts]
amfv-eval = "amfv_eval.cli:main"